name: Publicar TOKENIA y actualizar FIX
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1,13,19 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Banxico con credencial protegida
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python3 scripts/actualizar_fix.py
      - name: Preparar archivos públicos
        run: |
          mkdir _site
          cp index.html fx.json _site/
          cp LICENSES.txt _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
